# /etc/nginx/conf.d/headscale-console.conf
# Nginx is managed independently. Replace hs.example.com and certificate paths
# before use. Domain, DNS and certificate details: docs/nginx.md
#
# For hs.odata.cc, the certificate must have hs.odata.cc in its SAN. A
# certificate for another hostname fails with:
#   x509: certificate is valid for f.odata.cc, not hs.odata.cc
#
# Proxy all paths: /, /admin, /idp, /oidc and WebSocket. Do not proxy only
# /admin. OIDC logout uses /idp/end-session and returns to
# /admin/login?s=logout.

map $http_upgrade $hsc_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream headscale_console {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name hs.example.com;

    return 301 https://$host$request_uri;
}

server {
    # Newer nginx versions warn that "listen ... http2" is deprecated but it
    # remains compatible with Debian/Ubuntu nginx packages still in use.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hs.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:headscale_console:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    location / {
        proxy_pass http://headscale_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hsc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
