{{define "header"}}
<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Headscale Console</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f4; --card: #fff; --fg: #18181b; --muted: #57534e; --line: #d6d3d1; --accent: #111827; --danger: #b91c1c; --ok: #166534; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1b1b1e; --fg: #fafafa; --muted: #a1a1aa; --line: #333338; --accent: #e4e4e7; --danger: #f87171; --ok: #86efac; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, color-mix(in srgb, var(--accent) 8%, transparent), transparent 42%), var(--bg); color: var(--fg); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(94vw, 520px); margin: 32px 0; }
    .brand-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .language { display: flex; flex-shrink: 0; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--card) 70%, transparent); }
    .language a { border-radius: 999px; padding: 4px 9px; color: var(--muted); font-size: 12px; font-weight: 650; text-decoration: none; }
    .language a.active { background: var(--fg); color: var(--bg); }
    .mark { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-weight: 800; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 20px 60px rgb(0 0 0 / .08); }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 650; }
    input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: transparent; color: var(--fg); font: inherit; }
    input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 1px; }
    button, .button { display: inline-flex; width: 100%; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: transparent; color: var(--fg); font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
    button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
    .stack { display: grid; gap: 10px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .error, .notice { border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 14px; }
    .error { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
    .notice { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }
    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    .section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .identity { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
    .identity button { width: auto; padding: 7px 10px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <div class="brand-row">
    <div class="brand"><div class="mark">H</div><div><strong>Headscale Console</strong><div class="muted small">{{.T "app.tagline"}}</div></div></div>
    <nav class="language" aria-label="Language">
      {{range .LanguageLinks}}<a class="{{if .Active}}active{{end}}" href="{{.URL}}" hreflang="{{.Locale}}">{{.Label}}</a>{{end}}
    </nav>
  </div>
  <section class="card">
{{end}}

{{define "footer"}}
  </section>
  <p class="muted small" style="text-align:center">{{.T "app.footer"}}</p>
</main>
</body>
</html>
{{end}}
